name: WhatsApp Railway Scheduler

on:
  schedule:
    # 06:00 WIB
    - cron: "0 23 * * *"

    # 08:00 WIB
    - cron: "0 1 * * *"

  workflow_dispatch:
    inputs:
      action:
        description: "Pilih aksi WhatsApp"
        required: true
        type: choice
        options:
          - start
          - stop

concurrency:
  group: whatsapp-scheduler
  cancel-in-progress: false

jobs:
  manage-whatsapp:
    runs-on: ubuntu-latest

    steps:
      - name: Manage WhatsApp Railway Service
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}

          ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || (github.event.schedule == '0 23 * * *' && 'start' || 'stop') }}

        run: |
          node <<'NODE'
          const endpoint = "https://backboard.railway.com/graphql/v2";

          async function railway(query, variables = {}) {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                "Project-Access-Token": process.env.RAILWAY_TOKEN,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ query, variables })
            });

            const result = await response.json();

            if (!response.ok || result.errors?.length) {
              throw new Error(
                JSON.stringify(result.errors || result)
              );
            }

            return result.data;
          }

          async function getActiveDeployment() {
            const query = `
              query LatestActiveDeployment(
                $input: DeploymentListInput!
              ) {
                deployments(input: $input, first: 1) {
                  edges {
                    node {
                      id
                      status
                      createdAt
                    }
                  }
                }
              }
            `;

            const data = await railway(query, {
              input: {
                projectId: process.env.RAILWAY_PROJECT_ID,
                serviceId: process.env.RAILWAY_SERVICE_ID,
                environmentId: process.env.RAILWAY_ENVIRONMENT_ID,
                status: {
                  successfulOnly: true
                }
              }
            });

            return data.deployments.edges[0]?.node || null;
          }

          async function startWhatsApp() {
            const active = await getActiveDeployment();

            if (active) {
              console.log("WhatsApp sudah berjalan:", active.id);
              return;
            }

            console.log("Memulai WhatsApp service...");

            const mutation = `
              mutation StartWhatsApp(
                $input: EnvironmentTriggersDeployInput!
              ) {
                environmentTriggersDeploy(input: $input)
              }
            `;

            const result = await railway(mutation, {
              input: {
                projectId: process.env.RAILWAY_PROJECT_ID,
                environmentId: process.env.RAILWAY_ENVIRONMENT_ID,
                serviceId: process.env.RAILWAY_SERVICE_ID
              }
            });

            if (result.environmentTriggersDeploy !== true) {
              throw new Error("Gagal memicu deployment WhatsApp");
            }

            console.log("START berhasil dipicu");
          }

          async function stopWhatsApp() {
            const active = await getActiveDeployment();

            if (!active) {
              console.log("WhatsApp sudah berhenti");
              return;
            }

            console.log("Deployment ID:", active.id);
            console.log("Current status:", active.status);

            const mutation = `
              mutation StopWhatsApp($id: String!) {
                deploymentStop(id: $id)
              }
            `;

            const result = await railway(mutation, {
              id: active.id
            });

            if (result.deploymentStop !== true) {
              throw new Error("Railway gagal menghentikan deployment");
            }

            console.log("STOP berhasil dipicu");
          }

          async function main() {
            const action = process.env.ACTION;

            console.log("Action:", action);

            if (!process.env.RAILWAY_TOKEN ||
                !process.env.RAILWAY_PROJECT_ID ||
                !process.env.RAILWAY_ENVIRONMENT_ID ||
                !process.env.RAILWAY_SERVICE_ID) {
              throw new Error("Railway credentials belum lengkap");
            }

            if (action === "start") {
              await startWhatsApp();
            } else if (action === "stop") {
              await stopWhatsApp();
            } else {
              throw new Error("Action tidak valid");
            }
          }

          main().catch(error => {
            console.error("Railway Scheduler Error:", error);
            process.exit(1);
          });
          NODE
