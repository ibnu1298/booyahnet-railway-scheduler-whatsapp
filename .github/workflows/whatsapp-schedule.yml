
name: Railway Deployment Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Check Railway Deployments
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}

        run: |
          node <<'NODE'
          async function main() {
            const query = `
              query Deployments(
                $input: DeploymentListInput!
              ) {
                deployments(input: $input, first: 5) {
                  edges {
                    node {
                      id
                      status
                      createdAt
                    }
                  }
                }
              }
            `;

            const variables = {
              input: {
                projectId: process.env.PROJECT_ID,
                environmentId: process.env.ENVIRONMENT_ID,
                serviceId: process.env.SERVICE_ID
              }
            };

            const response = await fetch(
              "https://backboard.railway.com/graphql/v2",
              {
                method: "POST",
                headers: {
                  "Project-Access-Token": process.env.RAILWAY_TOKEN,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({ query, variables })
              }
            );

            const result = await response.json();

            console.log("HTTP:", response.status);
            console.log(JSON.stringify(result, null, 2));

            if (!response.ok || result.errors?.length) {
              throw new Error("Deployment query failed");
            }

            console.log("Deployment query berhasil!");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
